name: loc_360
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.3+7

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Path-based URLs for the marketing site (lib/website), so `/privacy` and `/invite/CODE`
  # work without a `#`. Web-only, reached through a conditional import.
  flutter_web_plugins:
    sdk: flutter
  # Already resolved transitively; promoted to a direct dependency for the site's mailto:,
  # store and `loc360://` links.
  url_launcher: ^6.3.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  app_links: ^7.2.1
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  # Hashes the SunioMax backup passcode before it is stored. Already present transitively; made
  # direct because this is the first place the app imports it, and an import that relies on
  # somebody else's dependency breaks on their next major version.
  crypto: ^3.0.7
  # Cashfree UPI Autopay checkout. Only ever handed a session id minted by an Edge Function —
  # no Cashfree credential reaches the device.
  flutter_cashfree_pg_sdk: ^2.4.0
  # Product analytics. The project token is deliberately not compiled in — it comes from the
  # `app_config` table at runtime, so tracking can be turned off server-side without a release,
  # and a checkout with no token simply runs on the no-op implementation.
  mixpanel_flutter: ^2.13.0
  # Version and build number in Dart. Mixpanel's native SDKs already attach their own
  # `$app_version_string`, so this is not for reporting the version — it is so the app can
  # compare the running version against the last one it saw and tell a fresh install from an
  # upgrade, which nothing else can answer.
  package_info_plus: ^10.2.1
  # Invites go out through the phone's own SMS app rather than a bulk SMS route: the Fast2SMS
  # account is a DLT-registered OTP template, and invite text is not OTP traffic.
  # ^13 rather than ^12: the older line pins win32 ^5, which collides with the one
  # flutter_secure_storage needs.
  share_plus: ^13.3.0
  # The paywall promo. Its URL is a public `app_config` row, so the clip can be recut, re-hosted
  # or withdrawn without a release — the same argument as `mixpanel_token`.
  #
  # No native wiring needed: Android already holds INTERNET, and the plugin's minSdk 24 is
  # exactly `flutter.minSdkVersion`. iOS specifically must NOT get the `audio` background mode —
  # see the lifecycle notes in `promo_video.dart` for why.
  video_player: ^2.14.0

  # Firebase. Only ever initialised by the phone build — `lib/boot/mobile_boot.dart` keeps the
  # whole app tree out of the web output, so the marketing site never loads any of this.
  #
  # Config comes from `lib/firebase_options.dart`, written by hand from the console's own
  # google-services.json / GoogleService-Info.plist rather than by the FlutterFire CLI.
  #
  # Note for the Android side: do NOT also add the `firebase-bom` and `firebase-analytics`
  # Gradle dependencies from Firebase's native setup guide. Each plugin below already declares
  # its own pinned native artifact, and a second BoM at the app level only puts them out of step
  # with each other. Applying the two Gradle plugins is the whole of the native wiring.
  firebase_core: ^4.14.0
  # Runs alongside Mixpanel rather than replacing it: Mixpanel owns the named, hand-curated
  # funnel, this is here for the automatic events (first_open, session_start, app_update) that
  # Google Ads and Play Console read and that Mixpanel cannot supply.
  firebase_analytics: ^12.5.0
  # The app's first real crash reporter. Until now the only field signal was the `App Crashed`
  # Mixpanel event in `mobile_boot_io.dart`, which carries three stack frames and never sees a
  # native crash at all. That event is deliberately kept — see `_reportUncaughtErrors`.
  firebase_crashlytics: ^5.3.0
  # Push. Wired but deliberately silent: nothing requests notification permission until
  # `PushMessaging.requestPermission()` is called from a screen, so no user is prompted out of
  # context on first launch.
  firebase_messaging: ^16.6.0

  # Ad attribution. The app is bought through Facebook Ads, so Facebook needs to be told which
  # installs went on to pay — without that its optimiser is training on installs, not on payers.
  #
  # A third sink beside Mixpanel and Firebase rather than a replacement, and a deliberately quiet
  # one: it receives four conversion events out of the ~70 this app fires. See
  # `facebook_analytics.dart` for why the rest are dropped rather than forwarded.
  facebook_app_events: ^0.30.5

  # iOS hands out no IDFA without an App Tracking Transparency prompt, and Facebook cannot
  # attribute an install to an ad without one. The prompt is deliberately not shown at launch —
  # see `att_consent.dart`.
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Build-time only: it generates the launcher icons and is never imported by the app.
  flutter_launcher_icons: ^0.14.4

  # For InMemorySharedPreferencesAsync, which lets the Facebook purchase guard be tested for what
  # it actually promises — that it survives the process being killed mid-payment.
  shared_preferences_platform_interface: ^2.4.1

  # `video_player` re-exports its options classes but not `VideoPlayerPlatform` itself, so a fake
  # player has to reach for the interface package directly. That fake is what lets the promo
  # warm-up be tested for the thing that actually matters — that a controller is handed over
  # exactly once — without a device or a network.
  video_player_platform_interface: ^6.9.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# Launcher icons, regenerated with `dart run flutter_launcher_icons`.
#
# Top-level, not nested under dev_dependencies — the tool reads this as its own root key, and
# indenting it one level deeper silently swallows whatever follows it.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Exported from the Spacewire Figma file.
  assets:
    - assets/images/
    - assets/icons/
    # Read at startup by flutter_dotenv. Declared as a directory, not a file, so a checkout
    # without app.env still builds — app.env.example is always present to keep it non-empty.
    # Bundled as a plain asset either way: this keeps keys out of git, not out of the binary.
    - assets/env/
    # SunioMax's artwork, kept apart from assets/images/ because the two apps in this build share
    # a repo and not a brand. A directory for the same reason as assets/env/ — the exports are not
    # in the repo yet and every widget that loads one falls back. See assets/suniomax/README.md.
    - assets/suniomax/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
